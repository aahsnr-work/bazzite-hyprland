# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-hyprland
description: Custom Universal Blue / Bazzite image with Hyprland, Noctalia Greeter, and baked developer tools.
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    remove:
      packages:
        - bluez-cups
        - "cardwire*"
        - gdm
        - gnome-bluetooth
        - gnome-bluetooth-libs
        - gnome-control-center
        - gnome-control-center-filesystem
        - gnome-online-accounts
        - gnome-online-accounts-libs
        - gnome-remote-desktop
        - gnome-rounded-blur
        - gnome-search-yafti
        - gnome-session
        - gnome-session-wayland-session
        - gnome-settings-daemon
        - gnome-shell
        - gnome-shell-common
        - gnome-shell-extension-common
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-user-theme
        - gnome-srpm-macros
        - gnome-user-docs
        - gnome-user-share
        - "mutter*"
        - "nano*"
        - "nautilus*"
        - NetworkManager-ssh-gnome
        - "papers*"
        - ptyxis
        # - steamdeck-gnome-presets
        - "steamdeck*"
        - "vim*"
        - "xdg-desktop-portal-gnome*"
        - "yelp*"
    install:
      skip-unavailable: false
      install-weak-deps: false
      packages:
        - accountsservice
        - bleachbit
        - bluez-tools
        - brightnessctl
        - cmake
        - cronie
        - curl
        - ddcutil
        - direnv
        - distrobox
        - fail2ban
        - file-roller
        - fontconfig
        - fonts-filesystem
        - gcc-c++
        - git
        - gnome-keyring
        - gnome-tweaks
        - go
        - greetd
        - grim
        - gsettings-desktop-schemas
        - gtk4-layer-shell
        - gzip
        - ImageMagick
        - imv
        - inotify-tools
        - jq
        - kitty
        - kitty-shell-integration
        - kitty-terminfo
        - libinput-utils
        - logrotate
        - lynis
        - mpv
        - neovim
        - ninja-build
        - nodejs
        - npm
        - papers
        - papirus-icon-theme
        - pipewire
        - pipewire-alsa
        - pipewire-gstreamer
        - pipewire-pulseaudio
        - pipewire-utils
        - pipx
        - pkgconf-pkg-config
        - policycoreutils-python-utils
        - pymol
        - qt5ct
        - slurp
        - sqlite
        - swappy
        - transmission-gtk
        - udiskie
        - xdg-desktop-portal
        - xdg-user-dirs
        - xdg-user-dirs-gtk
        - xorg-x11-server-Xorg
        - xorg-x11-server-Xwayland
        - zathura
        - zathura-pdf-poppler
        - zathura-plugins-all

  - type: dnf
    repos:
      cleanup: true
      copr:
        - lionheartp/Hyprland
        - sneexy/zen-browser
        - lilay/topgrade
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      skip-unavailable: false
      install-weak-deps: false
      packages:
        - cliphist
        - hyprland-git
        - noctalia-git
        - noctalia-greeter-git
        - nwg-look
        - qt6ct
        - topgrade
        - xdg-desktop-portal-hyprland
        - zed
        - zen-browser

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - JetBrains Mono
        - Noto Emoji
        - Noto Color Emoji

  - type: script
    scripts:
      - setup-nix-base.sh
      - install-vscode.sh
      - install-brave.sh
      - install-zotero.sh
      - install-obsidian.sh

  - type: chezmoi
    repository: "https://github.com/aahsnr-configs/dots"
    file-conflict-policy: replace
    all-users: true
    run-every: 1d

  - type: systemd
    system:
      enabled:
        - greetd.service
        - accounts-daemon.service
        - determinate-nix-init.service
    user:
      enabled:
        - home-manager-init.service
